<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Получение сертификата — СертФлоу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#1a202c;--muted:#718096;--accent:#2b6cb0;--accent-hover:#2c5282;--border:#e2e8f0}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a202c;--card:#2d3748;--text:#f7fafc;--muted:#a0aec0;--accent:#63b3ed;--accent-hover:#4299e1;--border:#4a5568}
}
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:center}
.logo-container{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px}
.logo-text{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}

main{max-width:700px;margin:0 auto;padding:40px 24px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:2rem;font-weight:800;margin:0 0 12px;letter-spacing:-0.5px}
.hero p{color:var(--muted);font-size:1.1rem;margin:0}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05)}
label{display:block;font-weight:600;margin-bottom:8px;font-size:1rem}
input{width:100%;font-family:inherit;font-size:1.1rem;padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);transition:border-color 0.2s}
input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:12px;margin-top:24px}
button{font-family:inherit;font-size:1rem;font-weight:600;padding:16px 24px;border-radius:12px;border:none;cursor:pointer;transition:all 0.2s;flex:1}
button.primary{background:var(--accent);color:white}
button.primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px)}
button.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
button.alt:hover:not(:disabled){background:var(--accent);color:white}
button:disabled{opacity:.5;cursor:not-allowed}

.preview{margin-top:32px}
canvas{width:100%;height:auto;border:1px solid var(--border);border-radius:12px;background:#fff;display:block;box-shadow:0 4px 6px rgba(0,0,0,0.05)}
#msg{margin-top:16px;min-height:1.5em;color:var(--muted);font-size:.95rem;text-align:center}
</style>
</head>
<body>

<header>
  <a href="/" class="logo-container">
    <div class="logo-icon">C</div>
    <div class="logo-text">СертФлоу</div>
  </a>
</header>

<main>
  <div class="hero">
    <h1>Ваш сертификат готов</h1>
    <p>Введите ФИО так, как оно должно быть указано в документе.</p>
  </div>
  
  <div class="card">
    <label for="fio">Фамилия Имя Отчество</label>
    <input id="fio" type="text" autocomplete="name" placeholder="Иванова Мария Александровна" maxlength="90">
    
    <div class="row">
      <button id="pdf" class="primary" disabled>Скачать PDF</button>
      <button id="png" class="alt" disabled>Скачать PNG</button>
    </div>
    <div id="msg" role="status"></div>
    
    <div class="preview"><canvas id="cv" width="2250" height="1590"></canvas></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var W = 1125, H = 795, S = 2;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var inp = document.getElementById('fio');
  var bp = document.getElementById('pdf'), bn = document.getElementById('png'), msg = document.getElementById('msg');
  var img = new Image(), ready = false;
  var certId = location.pathname.split('/').pop();
  
  // По умолчанию
  var nameBox = { x: 567, y: 570, maxWidth: 470, color: '#1a1a1a', fontFamily: 'serif', fontSize: 44 };

  function norm(s){return s.replace(/\s+/g,' ').trim().replace(/(^|[\s\-])(\S)/g,function(m,a,b){return a+b.toUpperCase()})}

  // Функция подбора размера (если имя слишком длинное)
  function fit(name, maxW, baseSize, fontFamily){
    for (var s = baseSize; s >= 20; s -= 2){
      ctx.font = (s*S)+'px '+fontFamily;
      if (ctx.measureText(name).width <= maxW*S) return {lines:[name], size:s};
    }
    var w = name.split(' '), best = null;
    for (var i = 1; i < w.length; i++){
      var a = w.slice(0,i).join(' '), b = w.slice(i).join(' ');
      ctx.font = (Math.round(baseSize*0.7)*S)+'px '+fontFamily;
      var m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
      if (!best || m < best.m) best = {m:m, l:[a,b]};
    }
    if (best && best.m <= maxW*S) return {lines: best.l, size: Math.round(baseSize*0.7)};
    for (var t = baseSize-2; t >= 14; t -= 2){
      ctx.font = (t*S)+'px '+fontFamily;
      if (ctx.measureText(name).width <= maxW*S) return {lines:[name], size:t};
    }
    return {lines:[name], size: 14};
  }

  function draw(){
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W*S, H*S);
    if (ready) ctx.drawImage(img, 0, 0, W*S, H*S);
    var name = norm(inp.value);
    if (!name) return;
    
    var r = fit(name, nameBox.maxWidth, nameBox.fontSize, nameBox.fontFamily);
    ctx.fillStyle = nameBox.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (r.size*S)+'px '+nameBox.fontFamily;
    
    if (r.lines.length === 1) {
      ctx.fillText(r.lines[0], nameBox.x*S, nameBox.y*S);
    } else {
      ctx.fillText(r.lines[0], nameBox.x*S, (nameBox.y - r.size*0.8)*S);
      ctx.fillText(r.lines[1], nameBox.x*S, nameBox.y*S);
    }
  }

  function fname(ext){
    var n = norm(inp.value).replace(/[\\\/:*?"<>|]/g,'').slice(0,60);
    return 'Сертификат - ' + n + '.' + ext;
  }

  function upd(){
    var ok = norm(inp.value).length > 1 && ready;
    bp.disabled = bn.disabled = !ok;
    draw();
  }

  function save(ext, data){
    msg.textContent = '';
    try {
      var blob;
      if (data instanceof Blob) blob = data;
      else {
        var mime = ext === 'pdf' ? 'application/pdf' : 'image/png';
        blob = new Blob([data], { type: mime });
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fname(ext);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      msg.textContent = 'Файл сохранен!';
    } catch(e){
      msg.textContent = 'Не удалось сохранить файл. Попробуйте ещё раз.';
    }
  }

  bp.onclick = function(){
    if (!window.jspdf){ msg.textContent = 'Не загрузилась библиотека PDF. Обновите страницу.'; return; }
    var pdf = new window.jspdf.jsPDF({ orientation:'landscape', unit:'px', format:[W,H], compress:true });
    pdf.addImage(cv.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, W, H);
    save('pdf', pdf.output('arraybuffer'));
  };
  bn.onclick = function(){
    cv.toBlob(function(b){ save('png', b); }, 'image/png');
  };
  inp.addEventListener('input', upd);

  img.onload = function(){ ready = true; upd(); };

  fetch('/api/cert/' + certId)
    .then(r => r.json())
    .then(d => {
      if (d.nameBox) nameBox = d.nameBox;
      img.src = d.templateUrl;
    })
    .catch(() => { msg.textContent = 'Не удалось загрузить шаблон сертификата.'; });
})();
</script>
</body>
</html>
