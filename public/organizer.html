<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создать сертификат — организатор</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f7fb;color:#1c2233;margin:0;padding:24px}
  main{max-width:640px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 6px}
  p.lead{color:#667;margin:0 0 20px}
  .card{background:#fff;border:1px solid #d5d9e6;border-radius:14px;padding:18px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type=file]{width:100%;padding:10px;border:1px dashed #d5d9e6;border-radius:10px;background:#f6f7fb}
  button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid #2b4a9b;background:#2b4a9b;color:#fff;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #msg{margin-top:12px;color:#667;min-height:1.4em}
  .link-box{margin-top:14px;padding:12px;border:1px solid #d5d9e6;border-radius:10px;background:#eef2ff;word-break:break-all;display:none}
  .link-box a{color:#2b4a9b;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Создать сертификат</h1>
  <p class="lead">Загрузите шаблон (JPG или PNG) — получите ссылку для участников.</p>
  <div class="card">
    <label for="file">Шаблон сертификата</label>
    <input id="file" type="file" accept="image/jpeg,image/png">
    <button id="go" disabled>Загрузить и получить ссылку</button>
    <div id="msg"></div>
    <div class="link-box" id="linkBox">
      Ссылка для участников:<br>
      <a id="link" href="#" target="_blank"></a>
    </div>
  </div>
</main>
<script>
const fileInput = document.getElementById('file');
const goBtn = document.getElementById('go');
const msg = document.getElementById('msg');
const linkBox = document.getElementById('linkBox');
const link = document.getElementById('link');

fileInput.addEventListener('change', () => {
  goBtn.disabled = !fileInput.files.length;
});

goBtn.addEventListener('click', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  goBtn.disabled = true;
  msg.textContent = 'Загружаю…';
  try {
    const fd = new FormData();
    fd.append('template', f);
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).error || 'Ошибка загрузки');
    const data = await r.json();
    const full = location.origin + data.url;
    link.href = full;
    link.textContent = full;
    linkBox.style.display = 'block';
    msg.textContent = 'Готово! Скопируйте ссылку и передайте участникам.';
  } catch (e) {
    msg.textContent = 'Ошибка: ' + e.message;
  } finally {
    goBtn.disabled = false;
  }
});
</script>
</body>
</html>
