<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создать сертификат — организатор</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f7fb;color:#1c2233;margin:0;padding:24px}
  main{max-width:800px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 6px}
  p.lead{color:#667;margin:0 0 20px}
  .card{background:#fff;border:1px solid #d5d9e6;border-radius:14px;padding:18px;margin-bottom:20px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type=file]{width:100%;padding:10px;border:1px dashed #d5d9e6;border-radius:10px;background:#f6f7fb}
  button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid #2b4a9b;background:#2b4a9b;color:#fff;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #msg{margin-top:12px;color:#667;min-height:1.4em}
  .link-box{margin-top:14px;padding:12px;border:1px solid #d5d9e6;border-radius:10px;background:#eef2ff;word-break:break-all;display:none}
  .link-box a{color:#2b4a9b;font-weight:600}
  
  /* Стили для редактора */
  .editor-wrap { position: relative; display: inline-block; margin-top: 16px; max-width: 100%; border: 1px solid #d5d9e6; border-radius: 8px; overflow: hidden; cursor: crosshair; }
  .editor-wrap canvas { display: block; max-width: 100%; height: auto; }
  .hint { font-size: 0.9rem; color: #667; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Создать сертификат</h1>
  <p class="lead">Загрузите шаблон, кликните по картинке в том месте, где должно быть имя, и получите ссылку.</p>
  
  <div class="card" id="step1">
    <label for="file">1. Шаблон сертификата (JPG или PNG)</label>
    <input id="file" type="file" accept="image/jpeg,image/png">
  </div>

  <div class="card" id="step2" style="display:none;">
    <label>2. Укажите место для имени</label>
    <p class="hint">Кликните по картинке (или перетащите маркер), чтобы указать, куда вписывать ФИО.</p>
    <div class="editor-wrap" id="editorWrap">
      <canvas id="canvasPreview" width="1125" height="795"></canvas>
    </div>
    
    <button id="go" style="margin-top:20px;">3. Загрузить и получить ссылку</button>
    <div id="msg"></div>
    <div class="link-box" id="linkBox">
      Ссылка для участников:<br>
      <a id="link" href="#" target="_blank"></a>
    </div>
  </div>
</main>

<script>
const fileInput = document.getElementById('file');
const step2 = document.getElementById('step2');
const canvas = document.getElementById('canvasPreview');
const ctx = canvas.getContext('2d');
const editorWrap = document.getElementById('editorWrap');
const goBtn = document.getElementById('go');
const msg = document.getElementById('msg');
const linkBox = document.getElementById('linkBox');
const link = document.getElementById('link');

let selectedFile = null;
let img = new Image();
let nameX = 567; // Координаты по умолчанию
let nameY = 570;
let nameMaxWidth = 470;

// При выборе файла
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  selectedFile = f;
  const url = URL.createObjectURL(f);
  img.src = url;
  img.onload = () => {
    step2.style.display = 'block';
    drawPreview();
  };
});

// Отрисовка превью
function drawPreview() {
  // Очищаем холст
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Рисуем картинку
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  // Рисуем маркер (точку), куда будет вставлено имя
  ctx.beginPath();
  ctx.arc(nameX, nameY, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(43, 74, 155, 0.7)';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Рисуем линии, показывающие ширину текста
  ctx.beginPath();
  ctx.moveTo(nameX - nameMaxWidth/2, nameY + 15);
  ctx.lineTo(nameX + nameMaxWidth/2, nameY + 15);
  ctx.strokeStyle = 'rgba(43, 74, 155, 0.5)';
  ctx.setLineDash([5, 5]);
  ctx.stroke();
  ctx.setLineDash([]); // Сбрасываем пунктир
}

// Обработка клика и перетаскивания по холсту
function handleMove(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  
  // Получаем координаты мыши/пальца относительно холста
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  // Переводим координаты экрана в координаты картинки (холста)
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  
  nameX = (clientX - rect.left) * scaleX;
  nameY = (clientY - rect.top) * scaleY;

  // Ограничиваем, чтобы не улетело за края
  nameX = Math.max(nameMaxWidth/2, Math.min(canvas.width - nameMaxWidth/2, nameX));
  nameY = Math.max(50, Math.min(canvas.height - 20, nameY));

  drawPreview();
}

// Слушатели событий мыши
let isDrawing = false;
editorWrap.addEventListener('mousedown', (e) => { isDrawing = true; handleMove(e); });
editorWrap.addEventListener('mousemove', (e) => { if (isDrawing) handleMove(e); });
window.addEventListener('mouseup', () => { isDrawing = false; });

// Слушатели событий тач-экрана (для телефонов)
editorWrap.addEventListener('touchstart', (e) => { isDrawing = true; handleMove(e); }, {passive: false});
editorWrap.addEventListener('touchmove', (e) => { if (isDrawing) handleMove(e); }, {passive: false});
window.addEventListener('touchend', () => { isDrawing = false; });

// Отправка данных на сервер
goBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  goBtn.disabled = true;
  msg.textContent = 'Загружаю…';
  
  try {
    const fd = new FormData();
    fd.append('template', selectedFile);
    fd.append('x', nameX);
    fd.append('y', nameY);
    fd.append('maxWidth', nameMaxWidth);

    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).error || 'Ошибка загрузки');
    
    const data = await r.json();
    const full = location.origin + data.url;
    link.href = full;
    link.textContent = full;
    linkBox.style.display = 'block';
    msg.textContent = 'Готово! Скопируйте ссылку и передайте участникам.';
  } catch (e) {
    msg.textContent = 'Ошибка: ' + e.message;
  } finally {
    goBtn.disabled = false;
  }
});
</script>
</body>
</html>
